<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team SuperX</title>
    <style>
        :root {
            --primary: #4a90e2;
            --dark: #2d3436;
            --light: #f9f9f9;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 50px 20px;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-weight: 700;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Member Card */
        .card {
            background: var(--white);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .name {
            margin: 10px 0 5px;
            font-size: 1.25rem;
        }

        .domain {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-links a {
            text-decoration: none;
            color: #bdc3c7;
            font-size: 14px;
            transition: 0.2s;
        }

        .social-links a:hover {
            color: var(--primary);
        }

        .bio-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .bio-btn:hover {
            opacity: 0.9;
        }

        /* Modal / Bio Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            position: relative;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Team SuperX</h1>
        <div id="team-grid" class="team-grid"></div>
    </div>

    <div id="bioModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeBio()">&times;</span>
            <h2 id="modalName"></h2>
            <h4 id="modalDomain" style="color: var(--primary);"></h4>
            <p id="modalDescription"></p>
        </div>
    </div>
    <div style="text-align: center; margin-top: 40px; font-size: 14px; color: #888;">
        &copy; 2025 SuperX Corporation Pvt Ltd. All rights reserved.
    </div>

    <script src="main.js"></script>

</body>

</html>
